name: Collect feeds

on:
  schedule:
    - cron: "20 7 * * *"    # 7:20 UTC = 3:20 am Toronto (EDT); GitHub can start late, so this leaves hours of slack
    - cron: "50 9 * * *"    # second run as a safety net
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        run: python collect.py
      - name: Commit digest
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add digest
          git diff --cached --quiet || git commit -m "Update feed digest $(date -u +%Y-%m-%d)"
          git push
